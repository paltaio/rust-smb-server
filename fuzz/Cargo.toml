[package]
name = "smb-server-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
smb-server = { path = ".." }
tokio = { version = "1.40", features = ["rt"] }

[workspace]

[profile.release]
debug = 1

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
