name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95'
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo fmt (fuzz)
        run: cargo fmt --manifest-path fuzz/Cargo.toml --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95'
          components: clippy

      - name: clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    env:
      VERSITYGW_VERSION: v1.11.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            versitygw_asset: versitygw_v1.11.0_Linux_x86_64.tar.gz
            versitygw_sha256: 1f075c9dc92fef232f5b3c7465711ddc5e1b062b2b6df4a3bd246a4be5b35b52
          - os: windows-latest
            versitygw_asset: versitygw_v1.11.0_Windows_x86_64.zip
            versitygw_sha256: 2c647cf9ed07ba9d35fdfbb38bb139bc8fde15dc0c94775cacfdf8ba4fdaf33a
          - os: macos-latest
            versitygw_asset: versitygw_v1.11.0_Darwin_arm64.tar.gz
            versitygw_sha256: 678555913e0eb574f38d1daef36fcc584392e9ae2bb966ee6d3d6bbab1e14c31
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95'

      - name: install versitygw
        shell: bash
        env:
          ASSET: ${{ matrix.versitygw_asset }}
          SHA256: ${{ matrix.versitygw_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/versitygw"
          cd "$RUNNER_TEMP/versitygw"
          curl -sSfL --retry 3 --retry-all-errors -o "$ASSET" "https://github.com/versity/versitygw/releases/download/$VERSITYGW_VERSION/$ASSET"
          if command -v sha256sum >/dev/null; then
            sum="$(sha256sum "$ASSET")"
          else
            sum="$(shasum -a 256 "$ASSET")"
          fi
          [ "${sum%% *}" = "$SHA256" ] || { echo "sha256 mismatch for $ASSET"; exit 1; }
          case "$ASSET" in
            *.zip) unzip -q "$ASSET" ;;
            *) tar -xzf "$ASSET" ;;
          esac
          name="${ASSET%.tar.gz}"
          bin="$PWD/${name%.zip}/versitygw"
          "$bin" --version
          if [ "$RUNNER_OS" = Windows ]; then
            bin="$(cygpath -w "$bin.exe")"
          fi
          echo "SMB_TEST_VERSITYGW=$bin" >> "$GITHUB_ENV"

      - name: cargo test
        run: cargo test --workspace --all-features

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95'

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  check-32bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95'
          targets: i686-unknown-linux-gnu

      - name: cargo check (i686)
        run: cargo check --workspace --all-targets --all-features --target i686-unknown-linux-gnu

  fuzz-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95'

      - name: cargo check (fuzz targets)
        env:
          RUSTFLAGS: --cfg fuzzing
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95'

      - name: install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: cargo audit
        run: |
          cargo generate-lockfile
          cargo audit
