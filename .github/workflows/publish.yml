name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95'

      - name: verify tag matches crate version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(grep -E '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - name: cargo test
        run: cargo test --workspace --all-features

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p smb-server
